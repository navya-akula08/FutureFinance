{% extends 'base.html' %}
{% block title %}Edit goal · FutureFinance{% endblock %}
{% block content %}
<div class="card auth"><div class="card-body"><h1 class="h3">Edit savings goal</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="name">Goal name</label><input class="form-control mb-2" id="name" name="name" maxlength="120" value="{{ goal.name }}" required><label class="form-label" for="target">Target amount (₹)</label><input class="form-control mb-2" id="target" name="target_amount" type="number" min="0.01" step="0.01" value="{{ goal.target_amount }}" required><label class="form-label" for="starting">Starting amount (₹)</label><input class="form-control mb-2" id="starting" name="starting_amount" type="number" min="0" step="0.01" value="{{ goal.starting_amount }}"><label class="form-label" for="date">Target date</label><input class="form-control mb-3" id="date" name="target_date" type="date" value="{{ goal.target_date.strftime('%Y-%m-%d') if goal.target_date else '' }}"><button class="btn btn-primary">Save goal</button> <a class="btn btn-outline-secondary" href="{{ url_for('goals') }}">Cancel</a></form></div></div>
{% endblock %}
