{% extends 'base.html' %}{% block title %}Edit transaction · FutureFinance{% endblock %}{% block content %}<div class="card auth"><div class="card-body"><h1 class="h3">Edit transaction</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Date</label><input class="form-control mb-2" type="date" name="date" value="{{ transaction.transaction_date.strftime('%Y-%m-%d') }}" required><label class="form-label">Amount</label><input class="form-control mb-2" type="number" min="0.01" step="0.01" name="amount" value="{{ transaction.amount }}" required><label class="form-label">Type</label><select class="form-select mb-2" name="type">{% for t in ['INCOME','EXPENSE'] %}<option {{ 'selected' if transaction.transaction_type==t }}>{{ t }}</option>{% endfor %}</select><label class="form-label">Category</label><select class="form-select mb-2" name="category_id">{% for c in categories %}<option value="{{ c.category_id }}" {{ 'selected' if transaction.category_id==c.category_id }}>{{ c.name }}</option>{% endfor %}</select><input class="form-control mb-2" name="merchant_name" value="{{ transaction.merchant_name or '' }}" placeholder="Merchant"><input class="form-control mb-2" name="description" value="{{ transaction.description or '' }}" placeholder="Description"><input class="form-control mb-3" name="payment_method" value="{{ transaction.payment_method or '' }}" placeholder="Payment"><button class="btn btn-primary">Save changes</button></form></div></div>{% endblock %}
