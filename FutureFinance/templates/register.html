{% extends 'base.html' %}{% block title %}Create account · FutureFinance{% endblock %}{% block content %}<div class="auth card shadow-sm"><div class="card-body p-4"><h1 class="h3">Create your account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Name</label><input class="form-control mb-3" name="name" maxlength="100" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (10+ characters)</label><input class="form-control mb-3" type="password" name="password" minlength="10" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0"><a href="{{ url_for('login') }}">Back to sign in</a></p></div></div>{% endblock %}
